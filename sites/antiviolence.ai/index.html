<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101412">
  <meta name="description" content="All reading points (now) specify three reading levels. Choose yours.">
  <title>Reading Level Test</title>
  <style>
    :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#101412;color:#eef3ed}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{text-align:center;max-width:760px;width:100%}
    p{font-size:clamp(1.4rem,3.8vw,2.6rem);line-height:1.6;font-weight:550;letter-spacing:-.035em;margin:0}
    .arithmetic{white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:0}
    a{font-weight:800;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.14em;border-radius:.15em;transition:text-decoration-color .15s}
    a:hover,a:focus-visible{text-decoration-color:currentColor}a:focus-visible{outline:2px solid currentColor;outline-offset:5px}
    .red{color:#ff7773}.yellow{color:#f4ce66}.green{color:#79d8a1}
    .plus{color:#b4c5b8;margin-inline:.15em}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <p>All reading points (now) specify<br>
      <span class="arithmetic">
        <a class="red" href="https://github.com/thinkthoughts/news/blob/main/MATH_00.md" aria-label="Math0 reading level">1</a><span class="plus">+</span><a class="yellow" href="https://github.com/thinkthoughts/news/blob/main/MATH_05.md" aria-label="Math5 reading level">1</a><span class="plus">+</span><a class="green" href="https://github.com/thinkthoughts/news/blob/main/MATH_29.md" aria-label="Math29 reading level">1</a>
      </span><br>reading levels:</p>
  </main>
</body>
</html>
