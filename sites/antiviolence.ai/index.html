<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>#antiviolent</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #13171c;
      --border: #2a3038;
      --text: #f2f4f7;
      --muted: #9aa4af;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .reading-point {
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .text {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 1.05rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .source {
      display: inline-block;
      margin-top: 18px;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 26px;
    }

    #position {
      color: var(--muted);
      font-size: 0.85rem;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 18px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #error {
      display: none;
      color: #ffb4b4;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>#antiviolent</h1>
    </header>

    <section class="reading-point" aria-live="polite">
      <article class="card">
        <p class="label">reading point</p>
        <p id="tweetText" class="text"></p>
        <a
          id="tweetUrl"
          class="source"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          original post ↗
        </a>
      </article>

      <article class="card">
        <p class="label">grok</p>
        <p id="grokText" class="text"></p>
      </article>
    </section>

    <p id="error"></p>

    <nav>
      <span id="position"></span>
      <button id="nextButton" type="button">next →</button>
    </nav>
  </main>

  <script>
    let entries = [];
    let index = 0;

    const tweetText = document.getElementById("tweetText");
    const grokText = document.getElementById("grokText");
    const tweetUrl = document.getElementById("tweetUrl");
    const nextButton = document.getElementById("nextButton");
    const position = document.getElementById("position");
    const error = document.getElementById("error");

    function render() {
      if (!entries.length) return;

      const entry = entries[index];

      tweetText.textContent = entry.text ?? "";
      grokText.textContent = entry.grok ?? "";

      tweetUrl.href = entry.url ?? "#";
      tweetUrl.hidden = !entry.url;

      position.textContent =
        entries.length > 1
          ? `${index + 1} / ${entries.length}`
          : "reading point 1";

      nextButton.disabled = entries.length < 2;
    }

    async function loadFeed() {
      try {
        const response = await fetch("feed.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        /*
          Current feed.json:
            { url, text, grok }

          Future feed.json:
            [
              { url, text, grok },
              { url, text, grok }
            ]

          For an array, the LAST entry is treated
          as the most recent reading point.
        */
        entries = Array.isArray(data) ? [...data].reverse() : [data];

        index = 0;
        render();
      } catch (err) {
        error.style.display = "block";
        error.textContent = `Unable to load feed.json: ${err.message}`;
        nextButton.disabled = true;
      }
    }

    nextButton.addEventListener("click", () => {
      if (entries.length < 2) return;

      index = (index + 1) % entries.length;
      render();
    });

    loadFeed();
  </script>
</body>
</html>
